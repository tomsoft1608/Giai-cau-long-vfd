<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giải Cầu Lông Công Ty</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0f1115;
    --panel: #181b21;
    --panel-2: #20242c;
    --line: #2a2e37;
    --ink: #f5f6f8;
    --ink-dim: #8b909c;
    --gold: #ff5b2e;
    --gold-2: #e0491f;
    --court: #00d2b4;
    --red: #ff4757;
    --blue: #3d7de0;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1300px 550px at 8% -8%, rgba(255,91,46,0.10), transparent 60%),
      radial-gradient(1300px 600px at 96% 6%, rgba(0,210,180,0.08), transparent 62%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .script{ font-family:'Space Grotesk', sans-serif; font-weight:700; }
  .display{ font-family:'Space Grotesk', sans-serif; font-weight:700; }
  .condensed{ font-family:'Barlow Condensed', sans-serif; letter-spacing:0.02em; }

  /* Top nav */
  .topbar{
    position:sticky; top:0; z-index:50;
    background:rgba(12,15,20,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .badge{
    width:34px;height:34px;border-radius:8px;
    background:linear-gradient(145deg,var(--gold),var(--gold-2));
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
  }
  .brand-text{ line-height:1.1; }
  .brand-text .t1{ font-size:15px; font-weight:700; }
  .brand-text .t2{ font-size:11px; color:var(--ink-dim); }

  .tabs{ display:flex; gap:4px; flex-wrap:wrap; }
  .tab-btn{
    background:transparent; border:1px solid transparent; color:var(--ink-dim);
    padding:9px 16px; border-radius:999px; font-size:14.5px; font-weight:600;
    cursor:pointer; transition:all .15s;
  }
  .tab-btn:hover{ color:var(--ink); background:var(--panel-2); }
  .tab-btn.active{ color:#0c0f14; background:var(--gold); }

  .admin-toggle{
    display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink-dim);
    padding:6px 12px; border:1px solid var(--line); border-radius:999px; cursor:pointer;
    user-select:none;
  }
  .admin-toggle.on{ color:var(--court); border-color:var(--court); }
  .dot{ width:7px;height:7px;border-radius:50%; background:var(--ink-dim); }
  .admin-toggle.on .dot{ background:var(--court); }

  .container{ max-width:1180px; margin:0 auto; padding:28px 20px 80px; }
  .hidden{ display:none !important; }

  .poster-img-wrap{
    border-radius:16px; overflow:hidden; border:1px solid var(--line);
    margin-bottom:24px; line-height:0; background:var(--panel);
  }
  .poster-img-wrap img{ width:100%; display:block; }
  .poster-cta-row{ display:flex; justify-content:center; }
  .hero-stats-bar{
    display:flex; gap:28px; flex-wrap:wrap; padding:18px 22px; margin-bottom:24px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
  }
  .ann-banner{
    position:relative; overflow:hidden; border-radius:16px; margin-bottom:22px;
    padding:32px 26px; text-align:left;
    background: linear-gradient(180deg,#14161c,#0f1115 65%);
    border:1px solid var(--line);
  }
  .ann-banner::before{
    content:''; position:absolute; left:-6%; top:0; bottom:0; width:26%;
    background:linear-gradient(160deg, rgba(255,91,46,0.16), transparent 70%);
    clip-path:polygon(0 0, 100% 0, 65% 100%, 0% 100%);
  }
  .ann-banner-kicker{ position:relative; font-size:11.5px; letter-spacing:0.16em; color:var(--gold); font-weight:700; text-transform:uppercase; }
  .ann-banner-title{ position:relative; font-family:'Space Grotesk'; font-weight:700; font-size:clamp(24px,4vw,34px); margin:6px 0 4px; color:var(--ink); letter-spacing:-0.01em; }
  .ann-banner-sub{ position:relative; font-size:14px; color:var(--ink-dim); }

  /* Hero / poster */
  .hero{
    position:relative; overflow:hidden;
    border-radius:16px;
    background:
      radial-gradient(700px 300px at 20% 10%, rgba(216,69,69,0.35), transparent 60%),
      radial-gradient(700px 300px at 85% 90%, rgba(61,125,224,0.35), transparent 60%),
      linear-gradient(160deg,#12161f, #0a0c10);
    border:1px solid var(--line);
    padding:48px 36px;
    margin-bottom:24px;
  }
  .hero .kicker{
    font-size:12.5px; letter-spacing:0.14em; color:var(--gold); font-weight:700;
    text-transform:uppercase; margin-bottom:10px;
  }
  .hero h1{
    font-size:clamp(34px,6vw,56px); margin:0 0 6px; line-height:0.98;
  }
  .hero .sub{ color:var(--ink-dim); font-size:15px; max-width:520px; margin-top:10px;}
  .hero-stats{ display:flex; gap:28px; margin-top:26px; flex-wrap:wrap; }
  .hero-stat .num{ font-size:30px; font-weight:800; font-family:'Barlow Condensed'; }
  .hero-stat .lbl{ font-size:12px; color:var(--ink-dim); }

  h2.section-title{
    font-family:'Barlow Condensed'; font-weight:700; font-size:26px; letter-spacing:0.01em;
    margin:0 0 4px;
  }
  .section-sub{ color:var(--ink-dim); font-size:14.5px; margin-bottom:18px; }

  /* Cards */
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px;
  }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media(max-width:760px){ .grid-2{ grid-template-columns:1fr; } }

  /* Category pills */
  .cat-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .cat-pill{
    padding:11px 18px; border-radius:999px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink-dim); font-size:14.5px; font-weight:600;
    cursor:pointer; transition:all .15s; display:flex; align-items:center; gap:8px;
  }
  .cat-pill .count{ background:var(--panel-2); padding:1px 7px; border-radius:999px; font-size:11px; }
  .cat-pill.active{ background:var(--gold); border-color:var(--gold); color:#0c0f14; }
  .cat-pill.active .count{ background:rgba(12,15,20,0.2); color:#0c0f14; }

  /* Form */
  label{ display:block; font-size:13.5px; color:var(--ink-dim); margin:12px 0 5px; font-weight:600;}
  input[type=text], select{
    width:100%; padding:12px 14px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--ink); font-size:15.5px; outline:none;
  }
  input[type=text]:focus, select:focus{ border-color:var(--gold); }
  input[type=date], input[type=time]{
    color-scheme:dark;
  }
  .btn{
    display:inline-flex; align-items:center; gap:7px; justify-content:center;
    padding:13px 22px; border-radius:9px; border:none; font-weight:700; font-size:15px;
    cursor:pointer; transition:transform .1s, opacity .15s;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:var(--gold); color:#0c0f14; }
  .btn-primary:hover{ background:var(--gold-2); }
  .btn-outline{ background:transparent; border:1px solid var(--line); color:var(--ink); }
  .btn-outline:hover{ border-color:var(--gold); color:var(--gold); }
  .btn-danger{ background:transparent; border:1px solid #4a2323; color:#e07070; }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }

  /* Athlete list */
  .roster{ margin-top:16px; display:flex; flex-direction:column; gap:8px; max-height:420px; overflow:auto; }
  .roster-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px;
    background:var(--panel-2); border-radius:8px; border:1px solid var(--line);
  }
  .avatar{
    width:34px;height:34px;border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:12.5px; font-weight:800; color:#0c0f14;
  }
  .roster-item .name{ font-size:15px; font-weight:600; }
  .roster-item .dept{ font-size:11.5px; color:var(--ink-dim); }
  .roster-item .rm{ margin-left:auto; cursor:pointer; color:var(--ink-dim); font-size:16px; padding:2px 6px;}
  .roster-item .rm:hover{ color:#e07070; }

  /* Plan timeline */
  .timeline{ position:relative; padding-left:26px; }
  .timeline::before{
    content:''; position:absolute; left:8px; top:6px; bottom:6px; width:2px; background:var(--line);
  }
  .t-item{ position:relative; padding-bottom:22px; }
  .t-item::before{
    content:''; position:absolute; left:-26px; top:3px; width:12px; height:12px; border-radius:50%;
    background:var(--panel); border:2px solid var(--gold);
  }
  .t-item.done::before{ background:var(--court); border-color:var(--court); }
  .t-item .t-date{ font-size:11.5px; color:var(--gold); font-weight:700; text-transform:uppercase; letter-spacing:0.04em;}
  .t-item.done .t-date{ color:var(--court); }
  .t-item .t-title{ font-size:16.5px; font-weight:700; margin:3px 0 2px; }
  .t-item .t-desc{ font-size:14.5px; color:var(--ink-dim); }
  .t-item .t-actions{ margin-top:6px; display:flex; gap:6px; }
  .mini-btn{ font-size:12.5px; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink-dim); cursor:pointer; }
  .mini-btn:hover{ color:var(--ink); border-color:var(--gold); }

  /* Announcements */
  .ann-item{ padding:12px 0; border-bottom:1px solid var(--line); }
  .ann-item:last-child{ border-bottom:none; }
  .ann-item .ann-date{ font-size:11px; color:var(--ink-dim); }
  .ann-item .ann-text{ font-size:15px; margin-top:3px; }

  /* Bracket - phong cách Knockout Stage hiện đại */
  .ko-hero{
    position:relative; overflow:hidden; border-radius:16px; margin-bottom:22px;
    padding:34px 24px 28px; text-align:center;
    background: linear-gradient(180deg,#14161c,#0f1115 65%);
    border:1px solid var(--line);
  }
  .ko-hero::before{
    content:''; position:absolute; left:-10%; top:0; bottom:0; width:34%;
    background:linear-gradient(160deg, rgba(255,91,46,0.22), transparent 70%);
    clip-path:polygon(0 0, 100% 0, 70% 100%, 0% 100%);
  }
  .ko-hero::after{
    content:''; position:absolute; right:-10%; top:0; bottom:0; width:34%;
    background:linear-gradient(200deg, rgba(0,210,180,0.16), transparent 70%);
    clip-path:polygon(30% 0, 100% 0, 100% 100%, 0% 100%);
  }
  .ko-hero .ko-kicker{ position:relative; font-size:11.5px; letter-spacing:0.18em; color:var(--gold); font-weight:700; text-transform:uppercase; margin-bottom:8px;}
  .ko-hero .ko-title{
    position:relative;
    font-family:'Space Grotesk'; font-weight:700; font-size:clamp(26px,5vw,42px); line-height:1; margin:0;
    color:var(--ink); letter-spacing:-0.01em;
  }
  .ko-hero .ko-sub{ position:relative; font-size:12.5px; color:var(--ink-dim); margin-top:8px; letter-spacing:0.03em; }

  .bracket-wrap{ overflow-x:auto; padding:6px 4px 34px; }
  .bracket{ display:flex; gap:38px; min-width:max-content; align-items:stretch; position:relative; }
  .round-col{ display:flex; flex-direction:column; justify-content:space-around; gap:16px; min-width:216px; }
  .round-label{
    text-align:center; font-family:'Barlow Condensed'; font-size:12.5px; font-weight:700;
    color:#c3c9d4; text-transform:uppercase; letter-spacing:0.1em; margin-bottom:10px;
    padding-bottom:8px; border-bottom:1px solid var(--line);
  }
  .match{ position:relative; display:flex; flex-direction:column; justify-content:center; flex:1; }
  .match-num{
    font-family:'Barlow Condensed'; font-size:10.5px; font-weight:700; color:#c3c9d4;
    text-align:center; letter-spacing:0.08em; margin-bottom:5px; text-transform:uppercase;
  }
  .match-box{
    background:linear-gradient(160deg,#171c25,#12151c); border-radius:8px; overflow:hidden;
    border:1px solid var(--line); border-left:3px solid var(--line);
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  .match-box.side-red{ border-left-color:var(--red); }
  .match-box.side-blue{ border-left-color:var(--blue); }
  .match-box.side-final{ border-left-color:var(--gold); box-shadow:0 0 0 1px rgba(240,180,41,0.4), 0 6px 18px rgba(240,180,41,0.12); }

  .m-slot{
    display:flex; align-items:center; gap:9px; padding:9px 10px;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .m-slot:last-child{ border-bottom:none; }
  .m-slot.winner{ background:rgba(47,174,107,0.12); }
  .m-slot .avatar{ width:24px;height:24px; font-size:10px; border:1px solid rgba(255,255,255,0.15); }
  .m-slot .pname{ font-size:12.5px; font-weight:700; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-transform:uppercase; letter-spacing:0.01em;}
  .m-slot .pname.bye{ color:#c3c9d4; font-style:italic; text-transform:none; font-weight:500;}
  .score-box{
    width:24px; height:22px; border-radius:5px; background:#0c0f14; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:#c3c9d4;
  }
  .m-slot.winner .score-box{ background:var(--court); color:#0c0f14; border-color:var(--court); }
  .score-input{
    width:24px; height:22px; border-radius:5px; background:#0c0f14; border:1px solid var(--line);
    color:var(--ink); text-align:center; font-size:12px; font-weight:800; padding:0;
  }
  .m-meta{ text-align:center; font-size:10px; color:#c3c9d4; margin-top:6px; text-transform:uppercase; letter-spacing:0.06em;}
  .connector{
    position:absolute; right:-38px; top:50%; width:38px; height:1px; background:var(--line);
  }
  .trophy-col{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:84px; }
  .trophy-icon{ font-size:56px; line-height:1; filter:drop-shadow(0 0 18px rgba(240,180,41,0.55)); }
  .trophy-lbl{ font-family:'Barlow Condensed'; font-size:13px; color:var(--gold); text-transform:uppercase; letter-spacing:0.1em; margin-top:8px; font-weight:700; text-align:center;}
  .confirm-row{ display:flex; justify-content:center; margin-top:5px; }

  /* Lưới điểm 3 set theo luật cầu lông */
  .set-grid-wrap{ margin-top:8px; padding:0 2px; }
  .set-grid{ display:flex; flex-direction:column; gap:3px; }
  .set-grid-row{ display:grid; grid-template-columns:52px repeat(3,1fr); gap:5px; align-items:center; }
  .set-grid-header .set-grid-col-label{
    text-align:center; font-size:9.5px; color:#c3c9d4; text-transform:uppercase; letter-spacing:0.05em; font-weight:700;
  }
  .set-grid-label{ font-size:10.5px; color:#c3c9d4; font-weight:700; }
  .set-input{
    width:100%; height:26px; border-radius:5px; background:#0c0f14; border:1px solid var(--line);
    color:var(--ink); text-align:center; font-size:13px; font-weight:800; padding:0;
  }
  .set-view{
    height:26px; border-radius:5px; background:#0c0f14; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; color:#c3c9d4;
  }
  .set-view-win{ background:rgba(0,210,180,0.14); border-color:var(--court); color:var(--court); }
  .set-warning{ font-size:11px; color:#ffb454; margin-top:6px; text-align:center; }
  .sched-row{ display:flex; gap:6px; margin-top:6px; padding:0 2px; }
  .sched-input{
    flex:1; min-width:0; padding:5px 6px; border-radius:5px; border:1.5px solid var(--gold);
    background:#0c0f14; color:#ffffff; font-size:11px; font-weight:600; color-scheme:dark;
  }
  .sched-input:focus{ outline:2px solid var(--court); outline-offset:1px; }
  .sched-view{
    text-align:center; font-size:11px; color:var(--gold); margin-top:6px; font-weight:600;
  }

  /* Schedule hero - kiểu poster SCHEDULE chữ script vàng */
  .sched-hero{
    text-align:center; padding:30px 20px 26px; margin-bottom:18px; border-radius:16px;
    position:relative; overflow:hidden;
    background: linear-gradient(180deg,#14161c,#0f1115 65%);
    border:1px solid var(--line);
  }
  .sched-hero::before{
    content:''; position:absolute; left:-10%; top:0; bottom:0; width:34%;
    background:linear-gradient(160deg, rgba(0,210,180,0.18), transparent 70%);
    clip-path:polygon(0 0, 100% 0, 70% 100%, 0% 100%);
  }
  .sched-hero::after{
    content:''; position:absolute; right:-10%; top:0; bottom:0; width:34%;
    background:linear-gradient(200deg, rgba(255,91,46,0.20), transparent 70%);
    clip-path:polygon(30% 0, 100% 0, 100% 100%, 0% 100%);
  }
  .sched-hero-kicker{ position:relative; font-size:11px; letter-spacing:0.16em; color:var(--court); font-weight:700; text-transform:uppercase; }
  .sched-hero-title{ position:relative; font-family:'Space Grotesk'; font-weight:700; font-size:clamp(28px,5vw,44px); color:var(--ink); margin:6px 0 2px; line-height:1; letter-spacing:-0.01em; }
  .sched-hero-sub{ position:relative; font-family:'Barlow Condensed'; font-size:14px; font-weight:700; letter-spacing:0.08em; color:var(--ink-dim); text-transform:uppercase; }

  /* Schedule tab - hàng nền trắng, giờ đen ở giữa */
  .sched-day-label{
    font-family:'Barlow Condensed'; font-size:15px; font-weight:700; color:var(--gold);
    margin:18px 0 8px; text-transform:uppercase; letter-spacing:0.04em;
  }
  .sched-day-label:first-child{ margin-top:0; }
  .sched-list{ display:flex; flex-direction:column; gap:9px; margin-top:10px; }
  .sched-card{
    display:grid; grid-template-columns:34px 1fr auto 1fr 34px; align-items:center; gap:10px;
    background:#f4f1e9; border-radius:8px; padding:10px 12px;
    box-shadow:0 3px 10px rgba(0,0,0,0.18);
  }
  .sched-flag{
    width:34px; height:24px; border-radius:4px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#fff;
  }
  .sched-team{ font-size:13px; font-weight:800; color:#14231a; text-transform:uppercase; letter-spacing:0.01em; }
  .sched-team.right{ text-align:right; }
  .sched-time-pill{
    background:#161e18; color:#fff; font-family:'Barlow Condensed'; font-weight:700; font-size:15px;
    padding:7px 14px; border-radius:5px; text-align:center; min-width:64px;
  }
  .sched-time-pill .d{ font-size:9px; color:var(--gold); font-weight:700; letter-spacing:0.04em; margin-bottom:1px; text-transform:uppercase; }
  .sched-meta-row{
    display:flex; justify-content:space-between; padding:0 4px; margin-top:3px;
  }
  .sched-cat{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-dim); font-weight:700; }
  .sched-court-badge{
    font-size:10.5px; color:var(--gold); font-weight:700;
  }
  .auto-panel{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-top:14px; }
  .auto-field{ display:flex; flex-direction:column; gap:5px; }
  .auto-field label{ margin:0; }
  .auto-field input{ width:130px; border:1.5px solid var(--gold); background:#0c0f14; color:#fff; color-scheme:dark; font-weight:600; }


  .empty-state{ text-align:center; padding:50px 20px; color:var(--ink-dim); }
  .empty-state .big{ font-size:38px; margin-bottom:10px; }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--panel-2); border:1px solid var(--gold); color:var(--ink);
    padding:10px 18px; border-radius:8px; font-size:13px; z-index:100;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .toast.show{ opacity:1; }

  .footer-note{ text-align:center; color:var(--ink-dim); font-size:12px; margin-top:40px; }

  /* Bốc thăm: chuyển chế độ + thủ công */
  .mode-toggle-row{ display:flex; gap:8px; margin-bottom:16px; }
  .mode-btn{
    flex:1; padding:12px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink-dim); font-weight:700; font-size:14.5px; cursor:pointer;
    transition:all .15s;
  }
  .mode-btn.active{ background:var(--gold); border-color:var(--gold); color:#0c0f14; }
  .mode-btn:hover:not(.active){ border-color:var(--gold); color:var(--ink); }
  .manual-preview{ display:flex; flex-direction:column; gap:8px; margin:14px 0; }
  .manual-pair-row{
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    background:var(--panel-2); border-radius:8px; border:1px solid var(--line); font-size:14px;
  }
  .manual-pair-num{ font-family:'Barlow Condensed'; font-weight:700; color:var(--gold); font-size:12.5px; text-transform:uppercase; min-width:56px; }

  .manual-pair-vs{ color:var(--ink-dim); font-size:12px; }
  .manual-chip-wrap{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .manual-chip{
    padding:10px 16px; border-radius:999px; background:var(--panel-2); border:1px solid var(--line);

  /* Custom modal (thay cho prompt/confirm bị chặn trong artifact) */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(6,8,11,0.72); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; z-index:200;
    padding:20px; opacity:0; transition:opacity .15s;
  }
  .modal-overlay.show{ opacity:1; }
  .modal-box{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:22px; width:100%; max-width:380px;
    transform:translateY(8px); transition:transform .15s;
  }
  .modal-overlay.show .modal-box{ transform:translateY(0); }
  .modal-title{ font-size:16px; font-weight:700; margin-bottom:14px; }
  .modal-field{ margin-bottom:12px; }
  .modal-field label{ margin:0 0 5px; }
  .modal-msg{ font-size:14px; color:var(--ink-dim); line-height:1.5; margin-bottom:18px; }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
</style>

  const CATS = [
    {id:'don_nam', name:'Đơn Nam', pair:false},
    {id:'don_nu', name:'Đơn Nữ', pair:false},
    {id:'doi_nam', name:'Đôi Nam', pair:true},
    {id:'doi_nu', name:'Đôi Nữ', pair:true},
    {id:'doi_nam_nu', name:'Đôi Nam Nữ', pair:true},
  ];
  const PALETTE = ['#d84545','#3d7de0','#2fae6b','#f0b429','#a855f7','#e0783d','#28a3a3','#c2469b'];

  let state = { athletes: [], brackets: {}, plan: [], announcements: [] };
  let activeTab = 'posterpage';
  let activeCat = CATS[0].id;
  let lastRegCategory = null;
  let isAdmin = false;
  let ready = false;

  const STORAGE_KEY = 'badminton_tournament_v1';

  function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; } return h; }
  function colorFor(name){ return PALETTE[hashStr(name) % PALETTE.length]; }
  function initialsFor(name){
    const parts = name.trim().split(/\s+/);
    if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
  }
  function fmtDate(d){ try{ return new Date(d).toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'}); }catch(e){ return d; } }
  function uid(){ return Math.random().toString(36).slice(2,10); }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2200);
  }

  function closeModal(overlay){
    overlay.classList.remove('show');
    setTimeout(()=>overlay.remove(), 150);
  }

  // modalPrompt: 1+ trường nhập liệu. fields = [{key,label,type,placeholder}]
  // Trả về Promise<object|null> (null nếu bấm Huỷ)
  function modalPrompt(title, fields){
    return new Promise((resolve)=>{
      const overlay = el('div','modal-overlay');
      const box = el('div','modal-box');
      box.appendChild(el('div','modal-title', escapeHtml(title)));
      const inputs = {};
      fields.forEach((f, idx)=>{
        const fw = el('div','modal-field');
        fw.appendChild(el('label','', escapeHtml(f.label)));
        const inp = document.createElement('input');
        inp.type = f.type || 'text';
        inp.placeholder = f.placeholder || '';
        if(f.value!==undefined && f.value!==null) inp.value = f.value;
        fw.appendChild(inp);
        box.appendChild(fw);
        inputs[f.key] = inp;
        if(idx===0){ setTimeout(()=>inp.focus(), 60); }
      });
      const actions = el('div','modal-actions');
      const cancelBtn = el('button','btn btn-outline','Huỷ');
      const okBtn = el('button','btn btn-primary','Xác nhận');
      cancelBtn.onclick = ()=>{ closeModal(overlay); resolve(null); };
      const submit = ()=>{
        const out = {};
        let hasEmpty = false;
        fields.forEach(f=>{

          out[f.key] = v;
        });

        closeModal(overlay); resolve(out);
      };
      okBtn.onclick = submit;
      Object.values(inputs).forEach(inp=>{
        inp.onkeydown = (e)=>{ if(e.key==='Enter') submit(); };
      });

      box.appendChild(actions);
      overlay.appendChild(box);
      overlay.onclick = (e)=>{ if(e.target===overlay){ closeModal(overlay); resolve(null); } };

      requestAnimationFrame(()=>overlay.classList.add('show'));
    });
  }

  /* ---------- Bracket logic ---------- */
  function nextPow2(n){ let p=1; while(p<n) p*=2; return p; }

  function buildBracketFromOrderedList(orderedEntries){
    if(orderedEntries.length < 2) return null;
    const size = Math.max(2, nextPow2(orderedEntries.length));
    const list = orderedEntries.slice();
    while(list.length < size) list.push(null); // BYE

    const totalRounds = Math.log2(size);
    const rounds = [];
    const r0 = [];
    for(let i=0;i<size/2;i++){
      const p1 = list[i*2], p2 = list[i*2+1];
      const m = { id: uid(), p1, p2, sets:[{s1:'',s2:''},{s1:'',s2:''},{s1:'',s2:''}], winner:null, date:'', time:'' };
      if(p1 && !p2){ m.winner='p1'; }
      if(p2 && !p1){ m.winner='p2'; }
      r0.push(m);
    }
    rounds.push(r0);
    for(let r=1; r<totalRounds; r++){
      const prevCount = rounds[r-1].length;
      const col = [];
      for(let i=0;i<prevCount/2;i++){
        col.push({ id: uid(), p1:null, p2:null, sets:[{s1:'',s2:''},{s1:'',s2:''},{s1:'',s2:''}], winner:null, date:'', time:'' });
      }
      rounds.push(col);
    }
    propagateByes(rounds);
    return { rounds, totalRounds };
  }

  function buildBracketFromRoster(catId){
    const entries = getEntriesForCategory(catId);
    if(entries.length < 2) return null;
    const shuffled = entries.slice().sort(()=>Math.random()-0.5);
    return buildBracketFromOrderedList(shuffled);
  }

  function getWinnerEntry(match){
    if(!match || !match.winner) return null;
    return match.winner==='p1' ? match.p1 : match.p2;
  }

  function propagateByes(rounds){
    for(let r=0; r<rounds.length-1; r++){
      rounds[r].forEach((m, i)=>{
        const w = getWinnerEntry(m);
        if(w){
          const nextMatch = rounds[r+1][Math.floor(i/2)];
          if(i%2===0) nextMatch.p1 = w; else nextMatch.p2 = w;
          // cascade further byes if next match now has a bye too
          if(nextMatch.p1 && !nextMatch.p2 && r+2<=rounds.length) {
            // wait for actual second slot; only auto-win if this round fully resolved as bye chain
          }
        }
      });
    }
    // second pass to auto-advance any resulting single-side byes (rare edge cases)
    for(let r=0; r<rounds.length-1; r++){
      rounds[r].forEach((m)=>{
        if(m.p1 && !m.p2 && !m.winner) m.winner='p1';
        if(m.p2 && !m.p1 && !m.winner) m.winner='p2';
      });
    }
  }

  function getEntriesForCategory(catId){
    const cat = CATS.find(c=>c.id===catId);
    const rows = state.athletes.filter(a=>a.category===catId);
    return rows.map(a=>({
      id: a.id,
      label: cat.pair ? (a.name + ' & ' + a.partner) : a.name,
      dept: a.dept
    }));
  }

  // Tính người thắng 1 set theo luật cầu lông: thắng khi >=21đ và cách biệt >=2, hoặc chạm 30đ thì thắng luôn
  function setWinner(s1raw, s2raw){
    const s1 = parseInt(s1raw), s2 = parseInt(s2raw);
    if(isNaN(s1) || isNaN(s2)) return null;
    if(s1===s2) return null;
    const hi = Math.max(s1,s2), lo = Math.min(s1,s2);
    if(hi < 21) return null;
    if(hi === 30) return s1>s2 ? 'p1' : 'p2';
    if(hi - lo >= 2) return s1>s2 ? 'p1' : 'p2';
    return null; // đang deuce, chưa đủ điều kiện thắng
  }

  function setStatusLabel(s1raw, s2raw){
    if(!s1raw && !s2raw) return null;
    const w = setWinner(s1raw, s2raw);
    if(w) return null; // đã có người thắng, không cần cảnh báo
    const s1 = parseInt(s1raw), s2 = parseInt(s2raw);
    if(isNaN(s1) || isNaN(s2)) return null;
    if(s1===s2) return 'Tỷ số hoà — chưa hợp lệ';
    const hi = Math.max(s1,s2);
    if(hi < 21) return 'Chưa đủ 21 điểm';
    return 'Cần cách biệt ≥2 điểm (deuce)';
  }

  // Đếm số set thắng của mỗi bên; thắng trận khi 1 bên thắng 2 set
  function matchWinnerFromSets(m){
    let p1Wins=0, p2Wins=0;
    m.sets.forEach(s=>{
      const w = setWinner(s.s1, s.s2);
      if(w==='p1') p1Wins++; else if(w==='p2') p2Wins++;
    });
    if(p1Wins>=2) return 'p1';
    if(p2Wins>=2) return 'p2';
    return null;
  }

  function setsWonCount(m, key){
    let n=0;
    m.sets.forEach(s=>{ if(setWinner(s.s1,s.s2)===key) n++; });
    return n;
  }

  function confirmMatchWinner(catId, roundIdx, matchIdx, winnerKey){
    const b = state.brackets[catId];
    if(!b) return;
    const m = b.rounds[roundIdx][matchIdx];
    m.winner = winnerKey;
    // push winner to next round
    if(roundIdx+1 < b.rounds.length){
      const w = getWinnerEntry(m);
      const nextMatch = b.rounds[roundIdx+1][Math.floor(matchIdx/2)];
      if(matchIdx%2===0) nextMatch.p1 = w; else nextMatch.p2 = w;
      // clear downstream winner if it depended on old value (simple reset)
    }
    saveState();
    render();
  }

  function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }

  // Vẽ đường nối kiểu esports (elbow connector) giữa các trận qua từng vòng, dựa trên vị trí thật của .match-box
  function drawBracketConnectors(bracket, boxRefs){
    const old = bracket.querySelector('svg.bracket-connectors');
    if(old) old.remove();

    const bRect = bracket.getBoundingClientRect();
    const svgW = bracket.scrollWidth;
    const svgH = bracket.scrollHeight;
    if(svgW===0 || svgH===0) return;

    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('class','bracket-connectors');
    svg.setAttribute('width', svgW);
    svg.setAttribute('height', svgH);
    svg.style.position='absolute';
    svg.style.left='0';
    svg.style.top='0';
    svg.style.pointerEvents='none';
    svg.style.zIndex='0';

    const NS = 'http://www.w3.org/2000/svg';
    for(let r=0; r<boxRefs.length-1; r++){
      boxRefs[r].forEach((elBox, i)=>{
        const targetEl = boxRefs[r+1][Math.floor(i/2)];
        if(!elBox || !targetEl) return;
        const aRect = elBox.getBoundingClientRect();
        const tRect = targetEl.getBoundingClientRect();
        const ax = aRect.right - bRect.left, ay = aRect.top + aRect.height/2 - bRect.top;
        const tx = tRect.left - bRect.left, ty = tRect.top + tRect.height/2 - bRect.top;
        const midX = ax + (tx-ax)/2;
        const path = document.createElementNS(NS,'path');
        path.setAttribute('d', `M ${ax} ${ay} H ${midX} V ${ty} H ${tx}`);
        path.setAttribute('stroke', '#ffffff');
        path.setAttribute('stroke-width', '2');
        path.setAttribute('stroke-opacity', '0.5');
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke-linejoin','round');
        svg.appendChild(path);
      });
    }
    bracket.insertBefore(svg, bracket.firstChild);
  }


  // Lưới nhập điểm 3 set (best-of-3, 21 điểm, cách biệt >=2, tối đa 30) + nút xác nhận
  function renderSetGrid(m, catId, rIdx, mIdx){
    const wrap = el('div','set-grid-wrap');
    const canEdit = isAdmin && !m.winner;

    const grid = el('div','set-grid');
    // header row
    const headerRow = el('div','set-grid-row set-grid-header');
    headerRow.appendChild(el('div','set-grid-label',''));
    for(let i=0;i<3;i++) headerRow.appendChild(el('div','set-grid-col-label', `Set ${i+1}`));
    grid.appendChild(headerRow);

    ['p1','p2'].forEach(key=>{
      const row = el('div','set-grid-row');
      const label = el('div','set-grid-label', key==='p1' ? 'Bên A' : 'Bên B');
      row.appendChild(label);
      m.sets.forEach((s, idx)=>{
        if(canEdit){
          const inp = document.createElement('input');
          inp.type='text'; inp.className='set-input'; inp.maxLength=2; inp.inputMode='numeric';
          inp.value = key==='p1' ? s.s1 : s.s2;
          inp.oninput = (e)=>{
            const v = e.target.value.replace(/[^0-9]/g,'');
            e.target.value = v;
            if(key==='p1') m.sets[idx].s1=v; else m.sets[idx].s2=v;
          };
          row.appendChild(inp);
        } else {
          const val = key==='p1' ? s.s1 : s.s2;
          const w = setWinner(s.s1, s.s2);
          const box = el('div','set-view'+(w===key?' set-view-win':''), val || '–');
          row.appendChild(box);
        }
      });
      grid.appendChild(row);
    });
    wrap.appendChild(grid);

    if(canEdit){
      // cảnh báo nếu set nào đó nhập rồi nhưng chưa hợp lệ theo luật
      const warnings = m.sets.map(s=>setStatusLabel(s.s1,s.s2)).filter(Boolean);
      if(warnings.length>0){
        wrap.appendChild(el('div','set-warning', '⚠️ '+warnings[0]));
      }
      const confirmRow = el('div','confirm-row');
      const cbtn = el('button','mini-btn','Xác nhận kết quả (thắng 2/3 set)');
      // Không khoá cứng theo trạng thái vẽ ban đầu (sẽ không cập nhật khi đang gõ điểm) —
      // kiểm tra hợp lệ ngay tại thời điểm bấm để luôn chính xác.
      cbtn.onclick = ()=>{
        const w = matchWinnerFromSets(m);
        if(!w){ showToast('⚠️ Cần 1 bên thắng đủ 2 set hợp lệ (≥21đ, cách biệt ≥2, tối đa 30đ) mới xác nhận được'); return; }
        confirmMatchWinner(catId, rIdx, mIdx, w);
      };
      confirmRow.appendChild(cbtn);
      wrap.appendChild(confirmRow);
    }
    return wrap;
  }


  function allMatchesFlat(){
    const out = [];
    CATS.forEach(cat=>{
      const b = state.brackets[cat.id];
      if(!b) return;
      const labels = roundLabels(b.rounds.length);
      b.rounds.forEach((round, rIdx)=>{
        round.forEach((m, mIdx)=>{
          if(m.p1 && m.p2 && !( (m.p1==='BYE')||(m.p2==='BYE') )){
            out.push({ cat: cat.id, catName: cat.name, roundLabel: labels[rIdx], rIdx, mIdx, match: m });
          }
        });
      });
    });
    return out;
  }

  function renderSchedule(app){
    const scheduleHero = el('div','sched-hero');
    scheduleHero.innerHTML = `
      <div class="sched-hero-kicker">GIẢI CẦU LÔNG NỘI BỘ · VFD</div>
      <div class="sched-hero-title script">Schedule</div>
      <div class="sched-hero-sub">LỊCH THI ĐẤU CÁC TRẬN</div>
    `;
    app.appendChild(scheduleHero);

    if(isAdmin){
      const autoCard = el('div','card');
      autoCard.appendChild(el('h2','section-title','⚙️ Tự động xếp lịch'));
      autoCard.querySelector('.section-title').style.fontSize = '16px';
      const desc = el('div','section-sub','Chỉ có 1 sân cầu lông công ty, các trận thi đấu lần lượt trong ngày. Rải các trận chưa có lịch theo đúng số trận/ngày đã đặt.');
      autoCard.appendChild(desc);

      const panel = el('div','auto-panel');
      function field(labelText, type, defVal){
        const f = el('div','auto-field');
        f.appendChild(el('label','',labelText));
        const inp = document.createElement('input'); inp.type=type; inp.value=defVal;
        f.appendChild(inp);
        panel.appendChild(f);
        return inp;
      }
      const dateInp = field('Ngày bắt đầu','date', new Date().toISOString().slice(0,10));
      const timeInp = field('Giờ bắt đầu','time','15:30');
      const perDayInp = field('Số trận / ngày','number','2'); perDayInp.min=1;
      const durInp = field('Phút / trận','number','30'); durInp.min=10;

      const runBtn = el('button','btn btn-primary','Xếp lịch cho các trận chưa có giờ');
      runBtn.style.height='42px';
      runBtn.onclick = ()=>{
        const perDay = Math.max(1, parseInt(perDayInp.value)||1);
        const dur = Math.max(10, parseInt(durInp.value)||30);
        const startDate = dateInp.value;
        const [sh, sm] = (timeInp.value||'15:30').split(':').map(Number);
        const pending = allMatchesFlat().filter(x=>!x.match.date && !x.match.time);
        if(pending.length===0){ showToast('✅ Không có trận nào cần xếp lịch'); return; }
        let slotIndex = 0;
        pending.forEach(item=>{
          const dayOffset = Math.floor(slotIndex / perDay);
          const slotInDay = slotIndex % perDay;
          const totalMinutes = sh*60 + sm + slotInDay*dur;
          const hh = String(Math.floor(totalMinutes/60)%24).padStart(2,'0');
          const mm = String(totalMinutes%60).padStart(2,'0');
          const d = new Date(startDate + 'T00:00:00');
          d.setDate(d.getDate() + dayOffset);
          item.match.date = d.toISOString().slice(0,10);
          item.match.time = `${hh}:${mm}`;
          slotIndex++;
        });
        saveState(); render();
        showToast(`🗓️ Đã xếp lịch ${pending.length} trận`);
      };
      panel.appendChild(runBtn);
      autoCard.appendChild(panel);
      app.appendChild(autoCard);
    }


    const flat = allMatchesFlat();
    const scheduled = flat.filter(x=>x.match.date || x.match.time).sort((a,b)=>{
      const da = (a.match.date||'9999') + (a.match.time||'99:99');
      const db = (b.match.date||'9999') + (b.match.time||'99:99');
      return da<db?-1:da>db?1:0;
    });
    const unscheduled = flat.filter(x=>!x.match.date && !x.match.time);

    const listWrap = el('div',''); listWrap.style.marginTop='16px';
    const listHead = el('h2','section-title', `Đã có lịch (${scheduled.length})`);
    listHead.style.fontSize='16px';
    listWrap.appendChild(listHead);

    if(scheduled.length===0){
      listWrap.appendChild(el('div','card', '<div class="empty-state">Chưa có trận nào được xếp lịch</div>'));
    } else {
      let lastDate = null;
      scheduled.forEach(item=>{
        const m = item.match;
        if(m.date !== lastDate){
          listWrap.appendChild(el('div','sched-day-label', m.date ? fmtDate(m.date) : 'Chưa có ngày'));
          lastDate = m.date;
        }
        const card = el('div','sched-card');

        const flag1 = el('div','sched-flag', initialsFor(m.p1.label));
        flag1.style.background = colorFor(m.p1.label);
        card.appendChild(flag1);

        card.appendChild(el('div','sched-team', escapeHtml(m.p1.label)));

        const timePill = el('div','sched-time-pill');
        timePill.innerHTML = `<div class="d">${item.roundLabel}</div>${m.time||'--:--'}`;
        card.appendChild(timePill);

        card.appendChild(el('div','sched-team right', escapeHtml(m.p2.label)));

        const flag2 = el('div','sched-flag', initialsFor(m.p2.label));
        flag2.style.background = colorFor(m.p2.label);
        card.appendChild(flag2);

        const metaRow = el('div','sched-meta-row');
        metaRow.style.gridColumn = '1 / -1';
        metaRow.innerHTML = `<span class="sched-cat">${item.catName}</span><span></span>`;
        card.appendChild(metaRow);

        listWrap.appendChild(card);
      });
    }
    app.appendChild(listWrap);

    if(unscheduled.length>0){
      const uwrap = el('div',''); uwrap.style.marginTop='20px';
      const uHead = el('h2','section-title',`Chưa xếp lịch (${unscheduled.length})`);
      uHead.style.fontSize='16px';
      uwrap.appendChild(uHead);
      unscheduled.forEach(item=>{
        const m = item.match;
        const row = el('div','card');
        row.style.marginBottom='8px'; row.style.padding='12px 16px';
        row.innerHTML = `<div class="sched-cat">${item.catName} · ${item.roundLabel}</div>
          <div style="margin-top:4px;font-size:13.5px;font-weight:700;color:var(--ink);">${escapeHtml(m.p1.label)} <span style="color:var(--ink-dim);font-weight:400;">vs</span> ${escapeHtml(m.p2.label)}</div>`;
        uwrap.appendChild(row);
      });
      app.appendChild(uwrap);
    }

    if(flat.length===0){
      app.appendChild(el('div','empty-state','Chưa có trận đấu nào (cần bốc thăm trước ở tab Bốc thăm)'));
    }
  }

  function roundLabels(n){
    const labels = [];
    const names = ['Chung kết','Bán kết','Tứ kết','Vòng 1/8','Vòng 1/16'];
    for(let i=0;i<n;i++){
      const fromEnd = n-1-i;
      labels.push(names[fromEnd] || `Vòng ${i+1}`);
    }
    return labels;
  }

  function renderSlot(m, key, catId, rIdx, mIdx){
    const entry = m[key];
    const isWinner = m.winner === key;
    const slot = el('div','m-slot'+(isWinner?' winner':''));
    if(!entry){
      slot.innerHTML = `<div class="avatar" style="background:#2a3140;color:#66707f;">?</div><div class="pname bye">Chưa xác định</div>`;
    } else if(entry==='BYE' || entry.id==='BYE'){
      slot.innerHTML = `<div class="avatar" style="background:#2a3140;"></div><div class="pname bye">BYE</div>`;
    } else {
      const av = el('div','avatar', initialsFor(entry.label));
      av.style.background = colorFor(entry.label);
      slot.appendChild(av);
      slot.appendChild(el('div','pname', entry.label));
    }
    // hiển thị số set đã thắng (chỉ khi đã có tỷ số)
    if(entry && m.p1 && m.p2){
      const wonSets = setsWonCount(m, key);
      const anyScoreEntered = m.sets.some(s=>s.s1!=='' || s.s2!=='');
      if(anyScoreEntered || m.winner){
        const sc = el('div','score-box', String(wonSets));
        slot.appendChild(sc);
      }
    }
    return slot;
  }

  /* ---------- Init (bản CHỈ XEM — không có chế độ BTC) ---------- */
  loadState();
})();
</script>
</body>
</html>
